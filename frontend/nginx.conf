# Nginx of the production frontend image: serves the static Vite build.
# The gateway adds the other security headers; this one adds the full
# Content-Security-Policy (security audit F-12). It is only here, not on the
# gateway, because the Vite dev server needs inline scripts that it blocks.
#
# - scripts, data and sockets: this site only (wss included in 'self')
# - styles: this site, the Google Fonts sheet, and inline styles (React
#   style={...} attributes, used by the card skins and the game board)
# - fonts: Google Fonts files
# - images: this site, and data: URLs (2FA QR code, CSS backgrounds)
server {
    listen 80;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
