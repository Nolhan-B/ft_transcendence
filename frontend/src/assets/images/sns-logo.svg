<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 128" fill="none">
  <defs>
    <!-- Cyberpunk neon gradient: electric cyan -> violet -> hot pink -->
    <linearGradient id="sns-cyber-grad" x1="16" y1="20" x2="224" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ff2a85" />
    </linearGradient>

    <!-- Tight single-pass glow to keep edges razor-sharp -->
    <filter id="crisp-neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Angular Cyberpunk SNS lettering with horizontal glitch slice -->
    <g id="sns-letters" transform="translate(120, 62) skewX(-10) translate(-120, -62)">
      <!-- First S (upper slice) -->
      <path d="M 28 16 L 78 16 L 72 31 L 36 31 L 36 49 L 74 49 L 74 59 L 26 59 L 20 53 L 20 24 Z" />
      <!-- First S (lower slice with subtle cyber offset) -->
      <path d="M 22.5 64 L 72.5 64 L 78.5 70 L 78.5 100 L 70.5 108 L 20.5 108 L 26.5 93 L 62.5 93 L 62.5 74 L 22.5 74 Z" />

      <!-- Center N (chamfered stems) -->
      <path d="M 92 100 L 92 24 L 100 16 L 109 16 L 132 70 L 132 16 L 140 16 L 148 24 L 148 100 L 140 108 L 131 108 L 108 54 L 108 108 L 100 108 Z" />

      <!-- Second S (upper slice) -->
      <path d="M 170 16 L 220 16 L 214 31 L 178 31 L 178 49 L 216 49 L 216 59 L 168 59 L 162 53 L 162 24 Z" />
      <!-- Second S (lower slice with subtle cyber offset) -->
      <path d="M 164.5 64 L 214.5 64 L 220.5 70 L 220.5 100 L 212.5 108 L 162.5 108 L 168.5 93 L 204.5 93 L 204.5 74 L 164.5 74 Z" />
    </g>
  </defs>

  <!-- Minimal HUD corner brackets -->
  <path d="M 10 28 V 12 L 16 6 H 44" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="square" />
  <path d="M 230 100 V 116 L 224 122 H 196" stroke="#ff2a85" stroke-width="2.5" stroke-linecap="square" />

  <!-- Subtle outer neon aura -->
  <use href="#sns-letters" fill="url(#sns-cyber-grad)" opacity="0.65" filter="url(#crisp-neon)" />

  <!-- Tight unblurred chromatic aberration for depth -->
  <use href="#sns-letters" transform="translate(-1.3, 0.8)" fill="#00f0ff" opacity="0.8" />
  <use href="#sns-letters" transform="translate(1.3, -0.8)" fill="#ff2a85" opacity="0.8" />

  <!-- Crisp main neon fill with sharp bright rim -->
  <use href="#sns-letters" fill="url(#sns-cyber-grad)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.8" />

  <!-- Segmented neon underline -->
  <rect x="24" y="118" width="118" height="3.5" fill="url(#sns-cyber-grad)" />
  <rect x="150" y="118" width="36" height="3.5" fill="#ff2a85" />
</svg>
