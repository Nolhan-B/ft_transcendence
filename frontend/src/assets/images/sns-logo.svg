<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none">
  <defs>
    <!-- Iconic Hotline Miami yellow -> orange -> hot pink fill -->
    <linearGradient id="hm-letters-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff200" />
      <stop offset="45%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <!-- Cyan neon glow for the triangle & slash -->
    <filter id="hm-cyan-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Reusable solid-filled chunky beveled SNS letters -->
    <g id="hm-sns-shapes">
      <!-- Left S -->
      <path d="M -117 -50 L -53 -50 L -53 -28 L -103 -28 L -103 -11 L -63 -11 L -53 -1 L -53 40 L -63 50 L -127 50 L -127 28 L -77 28 L -77 11 L -117 11 L -127 1 L -127 -40 Z" />
      <!-- Middle N -->
      <path d="M -37 50 L -37 -50 L -13 -50 L 15 10 L 15 -50 L 37 -50 L 37 50 L 13 50 L -15 -10 L -15 50 Z" />
      <!-- Right S -->
      <path d="M 63 -50 L 127 -50 L 127 -28 L 77 -28 L 77 -11 L 117 -11 L 127 -1 L 127 40 L 117 50 L 53 50 L 53 28 L 103 28 L 103 11 L 63 11 L 53 1 L 53 -40 Z" />
    </g>
  </defs>

  <!-- Inverted neon cyan arcade triangle behind the title -->
  <polygon
    points="180,204 54,24 306,24"
    fill="#0b0617"
    fill-opacity="0.7"
    stroke="#00f0ff"
    stroke-width="6"
    stroke-linejoin="miter"
    filter="url(#hm-cyan-glow)"
  />
  <polygon
    points="180,190 70,34 290,34"
    stroke="#ff2a85"
    stroke-opacity="0.6"
    stroke-width="2"
  />

  <!-- Heavy slanted 3D Hotline Miami "SNS" -->
  <g transform="translate(176 108) skewX(-14)">
    <!-- Solid 3D block extrusion (stacked offsets in deep purple & hot magenta) -->
    <use href="#hm-sns-shapes" transform="translate(12 13)" fill="#0b0617" />
    <use href="#hm-sns-shapes" transform="translate(9 10)" fill="#ff007f" />
    <use href="#hm-sns-shapes" transform="translate(6 7)" fill="#ff007f" />
    <use href="#hm-sns-shapes" transform="translate(3 4)" fill="#ff2a85" />

    <!-- Thick black outline separating the face from the 3D extrusion -->
    <use
      href="#hm-sns-shapes"
      fill="#0b0617"
      stroke="#0b0617"
      stroke-width="11"
      stroke-linejoin="round"
    />

    <!-- Main bright sunset gradient fill -->
    <use href="#hm-sns-shapes" fill="url(#hm-letters-grad)" />

    <!-- Sharp cyan lightning-slash underneath -->
    <polygon
      points="-126,64 134,56 122,68 -134,72"
      fill="#0b0617"
      transform="translate(4 4)"
    />
    <polygon
      points="-126,64 134,56 122,68 -134,72"
      fill="#00f0ff"
      filter="url(#hm-cyan-glow)"
    />
  </g>
</svg>
