events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # No nginx version in headers and error pages (security audit F-26)
    server_tokens off;

    # Login, sign-up and 2FA: 30 attempts per minute per IP, bursts of 30
    # (security audit F-06). Enough for a human and for the test suites,
    # far too slow to guess a password or a 6-digit code.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
    limit_req_status 429;

    # API answers carry personal data: never cached (security audit F-28)
    map $request_uri $api_cache_control {
        ~^/api/  "no-store";
        default  "";
    }

    server {
        listen 80;
        server_name localhost;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/ssl/transcendence.crt;
        ssl_certificate_key /etc/nginx/ssl/transcendence.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Docker DNS. The upstreams below go through variables so that nginx
        # resolves the service names at request time (at most 10s old): a
        # rebuilt container gets a new IP, and with a plain "proxy_pass
        # http://auth:3001" nginx would keep the old one until it restarts
        # (502 on every request). Side effect: no proxy_pass URI rewriting
        # with variables, so each block strips its prefix with "rewrite".
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $auth_upstream     auth:3001;
        set $game_upstream     game:3002;
        set $chat_upstream     chat:3003;
        set $user_upstream     user:3004;
        set $adminer_upstream  adminer:8080;
        set $frontend_upstream frontend:80;
        client_max_body_size 5M;

        # Security headers on every answer (security audit F-12). Declared
        # here only: a location with its own add_header would drop them.
        # frame-ancestors / X-Frame-Options: no clickjacking in an iframe.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control $api_cache_control always;

        # Brute-force targets, rate limited (security audit F-06). A regex
        # location wins over the /api/auth/ prefix below.
        location ~ ^/api/auth/(login|signup|2fa/validate|2fa/verify)$ {
            limit_req zone=auth_limit burst=30 nodelay;
            rewrite ^/api/auth/(.*)$ /$1 break;
            proxy_pass http://$auth_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Deny public access to Prometheus internal metrics endpoints
        location ~* ^/api/[^/]+/(metrics|internal)(/|$) {
            return 403;
        }

        location /api/auth/ {
            rewrite ^/api/auth/(.*)$ /$1 break;
            proxy_pass http://$auth_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket Game
        location /api/game/ws {
            rewrite ^/api/game/ws(.*)$ /ws$1 break;
            proxy_pass http://$game_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
        
        # REST Game
        location /api/game/ {
            rewrite ^/api/game/(.*)$ /$1 break;
            proxy_pass http://$game_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket Chat
        location /api/chat/ws {
            rewrite ^/api/chat/ws(.*)$ /ws$1 break;
            proxy_pass http://$chat_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # REST Chat
        location /api/chat/ {
            rewrite ^/api/chat/(.*)$ /$1 break;
            proxy_pass http://$chat_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/user/ {
            rewrite ^/api/user/(.*)$ /$1 break;
            proxy_pass http://$user_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /adminer {
            return 301 /adminer/;
        }

        location /adminer/ {
            rewrite ^/adminer/(.*)$ /$1 break;
            proxy_pass http://$adminer_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect / /adminer/;
        }

        location / {
            access_log off;
            proxy_pass http://$frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /uploads/ {
            proxy_pass http://$user_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}