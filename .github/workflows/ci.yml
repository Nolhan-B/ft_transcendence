name: CI Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [dev, main, "feat/**"]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    name: Code Quality & Audit & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Prettier Check
        run: npx prettier --check .

      - name: Risk Audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Game engine tests
        run: npm run test-game


  security:
    name: Check Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



  docker-build:
    name: Build & Validate Docker Stack
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Create temporary environment and secrets
        run: |
          mkdir -p secrets
          echo "dummy_password" > secrets/db_password.txt
          echo "postgresql://transcendence_user:dummy_password@postgres:5432/transcendence_db?schema=public" > secrets/db_url.txt
          echo "dummy_jwt_secret" > secrets/jwt_secret.txt

      - name: Build Docker images
        run: |
          docker compose build

      - name: Start Docker containers
        run: |
          docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to become healthy..."
          timeout 60s bash -c '
            until [ $(docker compose ps -q | xargs docker inspect --format="{{if .State.Health}}{{.State.Health.Status}}{{else}}healthy{{end}}" | grep -v "healthy" | wc -l) -eq 0 ]; do
              echo "Waiting for healthy status..."
              sleep 5
            done
          '
          echo "All services are up and healthy!"

      - name: Run E2E Smoke & Route Tests
        run: npm run test-e2e

      - name: Run API smoke tests
        run: npm run test-api

      - name: Dump Docker logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Stop containers
        if: always()
        run: |
          docker compose down -v
