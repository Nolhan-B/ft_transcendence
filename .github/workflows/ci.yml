name: CI Pipeline

on:
  push:
    branches: [ dev, main, "feat/**" ]
  pull_request:
    branches: [ dev, main ]

jobs:
  lint:
    name: Lint Code (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  security:
    name: Check Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  docker-build:
    name: Build & Validate Docker Stack
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Create temporary environment and secrets
        run: |
          mkdir -p secrets
          echo "dummy_password" > secrets/db_password.txt
          echo "postgresql://transcendence_user:dummy_password@postgres:5432/transcendence_db?schema=public" > secrets/db_url.txt
          echo "dummy_jwt_secret" > secrets/jwt_secret.txt

      - name: Build Docker images
        run: |
          docker compose build

      - name: Start Docker containers
        run: |
          docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to become healthy..."
          timeout 60s bash -c '
            until [ $(docker compose ps -q | xargs docker inspect --format="{{if .State.Health}}{{.State.Health.Status}}{{else}}healthy{{end}}" | grep -v "healthy" | wc -l) -eq 0 ]; do
              echo "Waiting for healthy status..."
              sleep 5
            done
          '
          echo "All services are up and healthy!"

      - name: Run E2E Smoke Tests
        run: |
          echo "=== 1. Checking Frontend Gateway ==="
          FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/)
          echo "Frontend HTTP Status: $FRONTEND_STATUS"
          if [ "$FRONTEND_STATUS" -ne 200 ]; then
            echo "::error::Frontend service is unreachable (expected HTTP 200, got $FRONTEND_STATUS)"
            exit 1
          fi

          echo "=== 2. Testing User Signup ==="
          SIGNUP_STATUS=$(curl -s -o signup.json -w "%{http_code}" -X POST http://127.0.0.1:8080/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"email":"cibot@test.com","username":"cibot","password":"securepassword123"}')
          echo "Signup HTTP Status: $SIGNUP_STATUS"
          cat signup.json
          if [ "$SIGNUP_STATUS" -ne 201 ]; then
            echo "::error::User signup failed with HTTP $SIGNUP_STATUS"
            exit 1
          fi

          echo "=== 3. Testing User Login ==="
          LOGIN_STATUS=$(curl -s -o login.json -w "%{http_code}" -X POST http://127.0.0.1:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"cibot@test.com","password":"securepassword123"}')
          echo "Login HTTP Status: $LOGIN_STATUS"
          cat login.json
          if [ "$LOGIN_STATUS" -ne 200 ]; then
            echo "::error::User login failed with HTTP $LOGIN_STATUS"
            exit 1
          fi

          # Extract JWT token from JSON response
          TOKEN=$(node -e "console.log(JSON.parse(require('fs').readFileSync('login.json')).token)")

          echo "=== 4. Testing Protected Route (/me) ==="
          ME_STATUS=$(curl -s -o me.json -w "%{http_code}" -X GET http://127.0.0.1:8080/api/auth/me \
            -H "Authorization: Bearer $TOKEN")
          echo "Me HTTP Status: $ME_STATUS"
          cat me.json
          if [ "$ME_STATUS" -ne 200 ]; then
            echo "::error::Protected route access failed with HTTP $ME_STATUS"
            exit 1
          fi

          echo "=== All E2E smoke tests passed successfully! ==="
 
      - name: Dump Docker logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Stop containers
        if: always()
        run: |
          docker compose down -v