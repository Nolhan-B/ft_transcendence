
docker-build:
    name: Build & Validate Docker Stack
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Create temporary environment and secrets
        run: |
          mkdir -p secrets
          echo "dummy_password" > secrets/db_password.txt
          echo "postgresql://transcendence_user:dummy_password@postgres:5432/transcendence_db?schema=public" > secrets/db_url.txt
          echo "dummy_jwt_secret" > secrets/jwt_secret.txt
          mkdir -p gateway/ssl
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout gateway/ssl/transcendence.key \
            -out gateway/ssl/transcendence.crt \
            -subj "/C=FR/ST=GrandEst/L=Mulhouse/O=42/CN=localhost"
          chmod 600 gateway/ssl/transcendence.key
          chmod 644 gateway/ssl/transcendence.crt

      - name: Build Docker images
        run: |
          docker compose build

      - name: Start Docker containers
        run: |
          docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to become healthy..."
          timeout 60s bash -c '
            until [ $(docker compose ps -q | xargs docker inspect --format="{{if .State.Health}}{{.State.Health.Status}}{{else}}healthy{{end}}" | grep -v "healthy" | wc -l) -eq 0 ]; do
              echo "Waiting for healthy status..."
              sleep 5
            done
          '
          echo "All services are up and healthy!"

      - name: Install dependencies
        run: npm ci

      - name: Compiling shared
        run: npm --prefix shared run build

      - name: Run Websocket game integration tests
        run: npm run test-game-integration

      - name: Run E2E Smoke & Route Tests
        run: npm run test-e2e

      - name: Run API smoke tests
        run: npm run test-api

      - name: Run Chat E2E tests
        run: npm run test-chat

      - name: Dump Docker logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Stop containers
        if: always()
        run: |
          docker compose down -v