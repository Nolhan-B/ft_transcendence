# Variables communes à tous les services qui parlent à la base (valeurs lues dans .env, défauts si absent).
# Le mot de passe, lui, vient du Docker secret db_password.
x-db-env: &db-env
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-transcendence_db}
  DB_USER: ${DB_USER:-transcendence_user}

services:
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
      target: dev
    volumes:
      - ./services/auth/src:/app/src
    environment:
      <<: *db-env
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - db_password
      - db_url
      - jwt_secret

  game:
    build:
      context: .
      dockerfile: services/game/Dockerfile
      target: dev
    volumes:
      - ./services/game/src:/app/src
    environment:
      <<: *db-env
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - db_password
      - db_url
      - jwt_secret
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3002/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  chat:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    volumes:
      - ./services/chat/src:/app/src
    environment:
      <<: *db-env
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - db_password
      - db_url
      - jwt_secret
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3003/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    volumes:
      - ./services/user/src:/app/src
      - user_uploads:/app/uploads
    environment:
      <<: *db-env
      NODE_ENV: development
    secrets:
      - db_password
      - db_url
      - jwt_secret
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3004/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider --no-check-certificate https://127.0.0.1/ || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      frontend:
        condition: service_started
      adminer:
        condition: service_started
      auth:
        condition: service_healthy
      game:
        condition: service_healthy
      chat:
        condition: service_healthy
      user:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-transcendence_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DB_NAME:-transcendence_db}
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:latest
    restart: always
    depends_on:
      - postgres
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'php -r ''fclose(fsockopen("127.0.0.1", 8080));'' || exit 1',
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ft_transcendence-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ft_transcendence-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./monitoring/grafana/monitoring.json:/var/lib/grafana/dashboards/transcendence.json:ro

volumes:
  postgres_data:
  user_uploads:
  prometheus_data:
  grafana_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_url:
    file: ./secrets/db_url.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
