
services:
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
      target: dev
    volumes:
      - ./services/auth/src:/app/src
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - db_password
      - db_url

  game:
    build:
      context: ./services/game
      dockerfile: Dockerfile
    volumes:
      - ./services/game/src:/app/src
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  chat:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    volumes:
      - ./services/chat/src:/app/src
    environment:
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - db_password
      - db_url
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    volumes:
      - ./services/user/src:/app/src
    environment:
      - NODE_ENV=development
    secrets:
      - db_password
      - db_url
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3004/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      volumes:
        - ./frontend:/app
        - /app/node_modules
      environment:
        - NODE_ENV=development
      healthcheck:
        test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ || exit 1"]
        interval: 10s
        timeout: 3s
        retries: 3
        start_period: 10s

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      frontend:
        condition: service_started
      adminer:
        condition: service_started
      auth:
        condition: service_healthy
      game:
        condition: service_healthy
      chat:
        condition: service_healthy
      user:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: transcendence_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: transcendence_db
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcendence_user -d transcendence_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:latest
    restart: always
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "php -r 'file_get_contents(\"http://127.0.0.1:8080\");' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s


volumes:
  postgres_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_url:
    file: ./secrets/db_url.txt
